        <h1>Victor Hugo Morales Herrera - Desarrollador Frontend Senior &amp; de Videojuegos</h1>
        <p>
          Más de 17 años de experiencia en desarrollo web y Front-End, diseñando y construyendo
          aplicaciones robustas, escalables y centradas en la experiencia de usuario. Especializado
          en JavaScript, React y tecnologías web modernas, con una sólida visión integral del
          desarrollo de software.
        </p>
        <h2>Servicios</h2>
        <p>
          Servicios freelance: desarrollo web con React y JavaScript, juegos arcade y casuales 2D
          con Unity, UI/UX e interfaces interactivas, optimización de rendimiento web, desarrollo
          asistido por IA con el agente Opencode y consultoría técnica para equipos.
        </p>
        <h2>Proyectos</h2>
        <p>
          Proyectos personales como port de Pacman, Tetris estilo Game Boy, Pang y un clon de dinosaurio
          con red neuronal, puedes verlos y jugarlos en
          <a href="https://pacman.victor-morales.site/">pacman.victor-morales.site</a> y
          <a href="https://tetris.victor-morales.site/">tetris.victor-morales.site</a>.
        </p>
        <h2>Experiencia</h2>
        <p>
          Desarrollador Frontend Senior en Fusiona (Febrero 2009 - Junio 2026), desarrollando
          proyectos para Movistar B2C, B2B y Corporación, el simulador PAES de la Universidad San
          Sebastián, el sitio web de la FIA, e implementando el Agente IA Opencode. Desarrollador
          Líder en Grupo MONBUCHILE (Marzo 2008 - Septiembre 2008).
        </p>
        <h2>Habilidades</h2>
        <p>
          JavaScript, React, TypeScript, CSS3, PHP, Node.js, Python, Unity, C#, Redux, REST APIs,
          Git, Docker, WordPress, Hugo.
        </p>
        <h2>Educación</h2>
        <p>Pontificia Universidad Católica de Chile y Universidad de Chile (FCFM).</p>
        <p>
          Contacto:
          <a href="mailto:contacto@vmh.cl">contacto@vmh.cl</a> -
